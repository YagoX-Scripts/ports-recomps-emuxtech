<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07101f"><title>YagoX Downloads</title>
<style>
:root{--bg:#050b16;--panel:#0b1627;--line:#243b55;--text:#f4f8ff;--muted:#9fb1c8;--mint:#35f2c0}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 0%,#142746,transparent 42%),#050b16;color:var(--text);font-family:system-ui,Arial,sans-serif}.wrap{max-width:1300px;margin:auto;padding:24px 16px 50px}.top{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:22px}.logo{width:60px;height:60px;border-radius:20px;background:#10223a;border:1px solid #29405a;display:grid;place-items:center;font-size:28px}.intro{flex:1;min-width:220px}.intro h1{margin:0;font-size:clamp(26px,4vw,42px)}.intro h1 span{color:var(--mint)}.intro p{margin:5px 0;color:#bac8d9}.search{background:#101c2f;border:1px solid var(--line);border-radius:14px;padding:14px;color:white;min-width:230px;flex:1;max-width:420px}.platforms,.cats{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 20px}.pill,.cat{background:#101c2f;color:#dce7f5;border:1px solid var(--line);padding:10px 14px;border-radius:12px;cursor:pointer}.active,.pill:hover,.cat:hover{background:var(--mint);color:#06251d;border-color:var(--mint)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.card{background:linear-gradient(145deg,#102036,#081321);border:1px solid #243a53;border-radius:18px;padding:8px;overflow:hidden}.cover{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:12px;background:#14253b}.placeholder{aspect-ratio:1/1;border-radius:12px;background:radial-gradient(circle,#176a68,#102038 65%);display:grid;place-items:center;font-size:50px}.card h3{font-size:15px;margin:10px 4px 4px}.meta{font-size:12px;color:var(--muted);margin:0 4px 12px}.btn{display:block;width:100%;border:1px solid #249c82;background:#105b50;color:#eafffa;padding:11px;border-radius:11px;font-weight:800;cursor:pointer}.empty{color:var(--muted);padding:35px;text-align:center;display:none}.adminlink{color:#7d94ad;text-decoration:none;font-size:12px;display:inline-block;margin-top:28px}.modal{display:none;position:fixed;inset:0;background:#020611d9;align-items:center;justify-content:center;padding:16px;z-index:5}.modal.open{display:flex}.dialog{width:min(550px,100%);max-height:90vh;overflow:auto;background:#0b1728;border:1px solid #31536b;border-radius:20px;padding:22px}.dialog h2{margin-top:0}.specs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.spec{background:#102036;border:1px solid var(--line);border-radius:10px;padding:10px}.spec small{display:block;color:var(--muted)}.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.links a{background:var(--mint);color:#04251d;text-decoration:none;padding:11px;border-radius:10px;font-weight:800;font-size:12px}.links a.off{opacity:.35;pointer-events:none}@media(max-width:950px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:650px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.wrap{padding:16px 10px}.search{max-width:none;min-width:100%}.card h3{font-size:13px}.pill,.cat{padding:9px 11px;font-size:12px}}@media(max-width:360px){.grid{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><header class="top"><div class="logo">🎮</div><div class="intro"><h1>YagoX <span>Downloads</span></h1><p>Explore o catálogo de jogos para Android, iOS e PC.</p></div><input id="search" class="search" placeholder="Buscar jogos..." aria-label="Buscar jogos"></header>
<nav class="platforms"><button class="pill active" data-platform="Todos">✦ Todos OS</button><button class="pill" data-platform="Android">◈ Android</button><button class="pill" data-platform="iOS">● iOS</button><button class="pill" data-platform="PC">▦ PC</button></nav>
<nav class="cats"><button class="cat active" data-cat="Todos">▦ Todos</button><button class="cat" data-cat="Ação">⚔ Ação</button><button class="cat" data-cat="Aventura">▲ Aventura</button><button class="cat" data-cat="Corrida">▰ Corrida</button><button class="cat" data-cat="Estratégia">♜ Estratégia</button><button class="cat" data-cat="Arcade">♧ Arcade</button><button class="cat" data-cat="Desporto">🏆 Desporto</button></nav>
<h3 id="count">Todos os jogos</h3><section class="grid" id="grid"></section><div class="empty" id="empty">Nenhum jogo encontrado.</div><a class="adminlink" href="admin.html">Área administrativa</a></main>
<div class="modal" id="modal"><div class="dialog"><button id="close" style="float:right;background:#15253b;color:white;border:1px solid #314760;border-radius:9px;padding:8px 12px">Fechar ×</button><h2 id="mtitle"></h2><p id="mdesc" style="color:#b8c7da;line-height:1.6"></p><div class="specs"><div class="spec"><small>Plataforma</small><b id="mplatform"></b></div><div class="spec"><small>Categoria</small><b id="mcat"></b></div><div class="spec"><small>Android mínimo</small><b id="mandroid"></b></div><div class="spec"><small>Tamanho</small><b id="msize"></b></div></div><div class="links" id="mlinks"></div></div></div>
<script>
const defaults=[
{id:"naruto",title:"Naruto Storm Generations",category:"Aventura",platforms:["Android"],cover:"",rating:5,downloads:5,description:"Port de Naruto Storm Generations para Android. Confira os requisitos e a compatibilidade da versão.",android:"A confirmar",size:"A confirmar",apkUrl:"",dataUrl:"",altUrl:"",icon:"🍥"},
{id:"gta-sa",title:"GTA San Andreas",category:"Aventura",platforms:["Android","iOS","PC"],cover:"",rating:2,downloads:2,description:"Grand Theft Auto: San Andreas. Disponibilidade conforme a versão e a plataforma.",android:"A confirmar",size:"A confirmar",apkUrl:"",dataUrl:"",altUrl:"",icon:"🌴"},
{id:"nfs-mw",title:"Need for Speed Most Wanted",category:"Corrida",platforms:["Android"],cover:"",rating:2,downloads:2,description:"Jogo de corrida da série Need for Speed.",android:"A confirmar",size:"A confirmar",apkUrl:"",dataUrl:"",altUrl:"",icon:"🏎️"},
{id:"nfsu2",title:"Need for Speed Underground 2",category:"Corrida",platforms:["Android"],cover:"",rating:0,downloads:0,description:"Clássico de corrida. Compatibilidade depende da versão publicada.",android:"A confirmar",size:"A confirmar",apkUrl:"",dataUrl:"",altUrl:"",icon:"🚘"},
{id:"tekken3",title:"Tekken 3 PORT APK",category:"Arcade",platforms:["Android"],cover:"",rating:0,downloads:0,description:"Versão identificada como Tekken 3 para Android. Verifique a origem do arquivo.",android:"A confirmar",size:"A confirmar",apkUrl:"",dataUrl:"",altUrl:"",icon:"🥊"},
{id:"forza2",title:"Forza Horizon 2",category:"Corrida",platforms:["Android"],cover:"",rating:0,downloads:0,description:"Projeto relacionado a Forza Horizon 2 para Android.",android:"A confirmar",size:"A confirmar",apkUrl:"",dataUrl:"",altUrl:"",icon:"🏁"},
{id:"woody",title:"Woody Woodpecker",category:"Aventura",platforms:["Android"],cover:"",rating:0,downloads:0,description:"Jogo do Pica-Pau. Confira a plataforma e versão.",android:"A confirmar",size:"A confirmar",apkUrl:"",dataUrl:"",altUrl:"",icon:"🐦"},
{id:"xhynv",title:"XHYNV GTA",category:"Ação",platforms:["Android"],cover:"",rating:0,downloads:0,description:"Projeto de GTA listado para Android.",android:"A confirmar",size:"A confirmar",apkUrl:"",dataUrl:"",altUrl:"",icon:"🎮"}
];
let games=defaults;let platform="Todos",cat="Todos";
async function load(){try{const r=await fetch("games.json",{cache:"no-store"});if(r.ok){const d=await r.json();if(Array.isArray(d)&&d.length)games=d}}catch(e){}render()}
const $=id=>document.getElementById(id);
function render(){let list=games.filter(g=>(platform==="Todos"||g.platforms.includes(platform))&&(cat==="Todos"||g.category===cat)&&g.title.toLowerCase().includes($("search").value.toLowerCase().trim()));$("grid").innerHTML=list.map(g=>`<article class="card">${g.cover?`<img class="cover" src="${esc(g.cover)}" alt="${esc(g.title)}">`:`<div class="placeholder">${esc(g.icon||"🎮")}</div>`}<h3>${esc(g.title)}</h3><div class="meta">${esc(g.category)} · ${esc(g.platforms.join(", "))}</div><button class="btn" data-id="${esc(g.id)}">⇩ DETALHES</button></article>`).join("");$("count").textContent=`${list.length} ${list.length===1?"jogo":"jogos"}`;$("empty").style.display=list.length?"none":"block"}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
document.querySelectorAll("[data-platform]").forEach(b=>b.onclick=()=>{platform=b.dataset.platform;document.querySelectorAll("[data-platform]").forEach(x=>x.classList.toggle("active",x===b));render()});
document.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{cat=b.dataset.cat;document.querySelectorAll("[data-cat]").forEach(x=>x.classList.toggle("active",x===b));render()});$("search").oninput=render;
$("grid").onclick=e=>{let b=e.target.closest("[data-id]");if(!b)return;let g=games.find(x=>x.id===b.dataset.id);$("mtitle").textContent=g.title;$("mdesc").textContent=g.description||"";$("mplatform").textContent=g.platforms.join(", ");$("mcat").textContent=g.category;$("mandroid").textContent=g.android||"A confirmar";$("msize").textContent=g.size||"A confirmar";$("mlinks").innerHTML=[["Download APK",g.apkUrl],["Download dados",g.dataUrl],["Arquivos alternativos",g.altUrl]].map(([n,u])=>u?`<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${n}</a>`:`<a class="off" href="#" aria-disabled="true">${n} (indisponível)</a>`).join("");$("modal").classList.add("open")};$("close").onclick=()=>$("modal").classList.remove("open");$("modal").onclick=e=>{if(e.target===$("modal"))$("modal").classList.remove("open")};load();
</script></body></html>
